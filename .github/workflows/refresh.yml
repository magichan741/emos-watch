name: Refresh watchlists

on:
  schedule:
    # emos 每天 8:00 / 17:00（北京时间）来抓，我们提前 10 分钟生成
    # 07:50 CST = 23:50 UTC；16:50 CST = 08:50 UTC
    - cron: "50 23 * * *"
    - cron: "50 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if [ -z "$TMDB_KEY" ]; then
            echo "未配置 TMDB_KEY，保留现有静态片单"
            exit 0
          fi
          python3 generate.py

      - name: Commit
        run: |
          git config user.name "emos-watch"
          git config user.email "emos-watch@users.noreply.github.com"
          git add watch
          if ! git diff --cached --quiet; then
            git commit -m "refresh $(date -u +%FT%TZ)"
            git push
          else
            echo "无变化"
          fi
